[project]
name = "ml-template"
version = "0.1.0"
description = "Portable ML dev environment (uv + Docker CUDA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.9.1",
    "tqdm>=4.67.0",
    "tensorboard>=2.19.0",
]

[dependency-groups]
jupyter = [
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
    "ipython>=8.30.0",
    "notebook>=7.3.0",
]
experiments = [
    "pandas>=2.2.0",
    "seaborn>=0.13.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = ["jupyter"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[tool.ruff]
line-length = 100
target-version = "py312"
