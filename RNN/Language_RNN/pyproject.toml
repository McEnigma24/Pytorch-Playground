[project]
name = "ml-template"
version = "0.1.0"
description = "Portable ML dev environment (uv + Docker CUDA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.9.1",
    "tqdm>=4.67.0",
    "tensorboard>=2.19.0",
    "mnists>=0.4.1",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
    "torchvision>=0.28.0",
    "transformers>=4.48.0",
    "onnxscript>=0.5.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "speakleash>=0.3.51",
]

[dependency-groups]
jupyter = [
    "jupyterlab>=4.3.0",
    "ipykernel>=6.29.0",
    "ipython>=8.30.0",
    "notebook>=7.3.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
default-groups = ["jupyter"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
